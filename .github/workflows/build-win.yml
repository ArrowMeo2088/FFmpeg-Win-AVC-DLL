name: Build Windows x64 (MSYS2 AVC static)

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-win.yml'
      - 'scripts/**'
      - 'BUILD.md'
      - 'configure'
      - 'libavcodec/**'
      - 'libavformat/**'
      - 'libavutil/**'
      - 'libavfilter/**'
      - 'libswresample/**'
      - 'libswscale/**'
  workflow_dispatch:

concurrency:
  group: ffmpeg-win-msys2-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64_static:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg build tree
        uses: actions/cache@v4
        with:
          path: build/win-x64-static
          key: ffmpeg-avc-static-${{ hashFiles('scripts/configure-avc-dash-mingw-static.sh') }}
          restore-keys: |
            ffmpeg-avc-static-

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libvpl
            mingw-w64-x86_64-libxml2
            make
            diffutils

      - name: Build static FFmpeg (AVC + DASH)
        shell: msys2 {0}
        run: bash ./scripts/build-win-mingw-static.sh

      - name: Print config.log on failure
        if: failure()
        shell: msys2 {0}
        run: |
          if [[ -f build/win-x64-static/ffbuild/config.log ]]; then
            tail -n 200 build/win-x64-static/ffbuild/config.log
          fi

      - name: Verify artifact layout
        shell: msys2 {0}
        run: |
          test -d dist/ffmpeg-win-x64-static/prefix/lib
          ls dist/ffmpeg-win-x64-static/prefix/lib/*.a
          test -f dist/ffmpeg-win-x64-static/bin/libvpl-2.dll
          test -f dist/ffmpeg-win-x64-static/MANIFEST.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win-x64-static-${{ github.run_number }}
          path: dist/ffmpeg-win-x64-static/
          retention-days: 30
          if-no-files-found: error
