name: Build Windows x64 MSVC (AVC + DASH, static for mpv)

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'doc/**'
      - 'tests/**'
      - '.forgejo/**'
      - 'CREDITS'
      - 'MAINTAINERS'
      - 'Changelog'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-win-msvc-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:\vcpkg

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Setup MSYS2 (make, nasm)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            diffutils
            nasm

      - name: Install NASM
        shell: pwsh
        run: |
          winget install --accept-source-agreements --accept-package-agreements NASM.NASM

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            libvpl:x64-windows `
            libxml2:x64-windows-static `
            pkgconf:x64-windows

      - name: Configure, build, package
        shell: pwsh
        env:
          PKG_CONFIG: C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows\lib\pkgconfig;C:\vcpkg\installed\x64-windows-static\lib\pkgconfig
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio not found" }
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=amd64 -host_arch=amd64'
          # DevShell resets PATH; re-add MSYS2 + NASM after it.
          $env:PATH = @(
            'C:\msys64\clang64\bin',
            'C:\msys64\usr\bin',
            'C:\Program Files\NASM',
            "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          ) + (
            $env:PATH -split ';' | Where-Object {
              $_ -and $_ -ne 'C:\Program Files\LLVM\bin' -and `
              $_ -ne 'C:\Program Files\CMake\bin' -and `
              $_ -ne 'C:\Strawberry\c\bin'
            }
          ) -join ';'
          $env:MSYSTEM = 'CLANG64'
          $env:CHERE_INVOKING = '1'
          $env:MSYS2_PATH_TYPE = 'inherit'
          & 'C:\msys64\usr\bin\bash.exe' -lc "./scripts/build-win-msvc.sh"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win-msvc-x64-avc-dash-${{ github.run_number }}
          path: dist/ffmpeg-win-msvc-x64/
          retention-days: 30
