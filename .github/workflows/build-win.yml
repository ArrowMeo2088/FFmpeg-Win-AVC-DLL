name: Build Windows x64 MSVC (AVC + DASH, static for mpv)

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'doc/**'
      - 'tests/**'
      - '.forgejo/**'
      - 'CREDITS'
      - 'MAINTAINERS'
      - 'Changelog'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-win-msvc-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:\vcpkg

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Setup MSYS2 (make, nasm)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            diffutils
            nasm

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            libvpl:x64-windows `
            libxml2:x64-windows-static `
            pkgconf:x64-windows

      - name: Export MSVC environment
        shell: pwsh
        run: ./scripts/ci-export-vcvars.ps1

      - name: Configure, build, package
        shell: msys2 {0}
        run: bash ./scripts/ci-build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win-msvc-x64-avc-dash-${{ github.run_number }}
          path: dist/ffmpeg-win-msvc-x64/
          retention-days: 30
          if-no-files-found: error
